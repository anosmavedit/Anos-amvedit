<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anosカミ | Profile</title>

<!-- FAVORITE ICON (TAB LOGO) -->
<link rel="icon" type="image/jpeg" href="https://i.postimg.cc/pXBrdS2z/v8Yw-Jb.jpg">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    width: 100vw;
    display:flex;
    flex-direction: column;
    justify-content: space-between;
    align-items:center;
    overflow: hidden; 
    background:#000;
    padding: 25px 20px;
    contain: content;
}

/* HARDWARE-ACCELERATED BACKGROUND VIDEO */
.video-background {
    position: fixed;
    top: 50%;
    left: 50%;
    min-width: 100vw;
    min-height: 100vh;
    width: auto;
    height: auto;
    z-index: -5;
    transform: translate3d(-50%, -50%, 0); 
    filter: brightness(25%) contrast(1.05);
    pointer-events: none;
    will-change: transform;
    object-fit: cover;
}

/* BRIGHTENED CYBER GRID BACKGROUND LINES */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(0,195,255,0.12) 1.5px, transparent 1.5px),
    linear-gradient(90deg, rgba(0,195,255,0.12) 1.5px, transparent 1.5px);
    background-size:50px 50px;
    transform: translate3d(0,0,0);
    animation:gridMove 20s linear infinite;
    z-index:-3;
    pointer-events:none;
}

@keyframes gridMove{
    from{ transform: translate3d(0,0,0); }
    to{ transform: translate3d(0,50px,0); }
}

.overlay{
    position:fixed;
    inset:0;
    background: rgba(0, 4, 10, 0.25);
    backdrop-filter: blur(1px);
    z-index:-4;
}

/* TOP NAVIGATION - INCREASED GLOW OUTLINE TABS */
.top-nav {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    gap: 15px;
    z-index: 10;
}

.nav-btn {
    flex: 1;
    border: none;
    outline: none;
    cursor: pointer;
    background: rgba(0,195,255,0.1);
    border: 1.5px solid rgba(0,195,255,0.65);
    color: #00c3ff;
    padding: 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 10px rgba(0,195,255,0.2);
    transition: transform 0.2s, background 0.2s, box-shadow 0.2s, border-color 0.2s;
    text-align: center;
}

.nav-btn:hover {
    transform: scale(1.02);
    background: rgba(0,195,255,0.25);
    border-color: #00c3ff;
    box-shadow: 0 0 20px rgba(0,195,255,0.7);
}

/* PROFILE CARD DESIGN */
.card-container{
    position:relative;
    width:100%;
    max-width: 420px;
    z-index: 2;
    margin: auto 0;
}

.card{
    background:rgba(0,8,20,0.76);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-radius:22px;
    padding:35px 24px;
    text-align:center;
    border: 1px solid rgba(0,195,255,0.25);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 15px rgba(0,195,255,0.1);
}

/* ADVANCED 3-TIER HALF RING SYSTEM + NEON BLUE LOGO STYLING */
.avatar-container {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    filter: drop-shadow(0 0 15px #00c3ff); /* NEON BLUE GLOW */
}

.ring-layer-1 {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #00c3ff;
    border-bottom-color: #00c3ff;
    filter: drop-shadow(0 0 12px rgba(0, 195, 255, 0.8));
    animation: ringSpinClockwise 4s linear infinite;
    will-change: transform;
}

.ring-layer-2 {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-left-color: rgba(0, 195, 255, 0.85);
    border-right-color: rgba(0, 195, 255, 0.85);
    animation: ringSpinCounter 3s linear infinite;
    will-change: transform;
}

.ring-layer-3 {
    position: absolute;
    inset: 15px;
    border-radius: 50%;
    border: 2px dashed transparent;
    border-top-color: #00c3ff;
    animation: ringSpinClockwise 1.5s linear infinite;
    will-change: transform;
}

@keyframes ringSpinClockwise {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes ringSpinCounter {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
}

.avatar{
    width:92px;
    height:92px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #00c3ff;
    box-shadow: 0 0 15px #00c3ff;
    z-index:2;
}

.name{
    color:#fff;
    font-size:24px;
    font-weight:800;
    margin-bottom:8px;
    letter-spacing:1px;
    text-shadow:0 0 12px rgba(0,195,255,0.6);
}

.bio{
    color:rgba(255,255,255,0.85);
    font-size:11px;
    line-height:1.6;
    margin-bottom:15px;
    font-style:italic;
}

.role{
    color:#00c3ff;
    font-size:10px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:4px;
    margin-bottom:20px;
}

/* LINK TABS - BRIGHTENED OUTLINES */
.links {
    display:flex;
    flex-direction:column;
    gap:10px;
}

.links a{
    text-decoration:none;
    color:#fff;
    background:rgba(0,195,255,0.08);
    border:1.5px solid rgba(0,195,255,0.5); 
    padding:12px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
    letter-spacing:1px;
    text-transform:uppercase;
    box-shadow: 0 0 8px rgba(0,195,255,0.15);
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
}

.links a:hover{
    background:rgba(0,195,255,0.2);
    border-color:#00c3ff;
    box-shadow: 0 0 18px rgba(0,195,255,0.6);
}

/* VISITOR COUNTER STYLING */
.visit-counter {
    margin-top: 15px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #00c3ff;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0, 195, 255, 0.7);
    background: rgba(0, 195, 255, 0.05);
    border: 1px solid rgba(0, 195, 255, 0.3);
    padding: 8px 12px;
    border-radius: 8px;
    display: inline-block;
}

/* INTENSIFIED ACTIONS BUTTON */
.bottom-nav {
    width: 100%;
    max-width: 420px;
    z-index: 10;
}

.warning-btn {
    position: relative;
    width: 100%;
    background: linear-gradient(135deg, rgba(255, 0, 60, 0.25), rgba(20, 0, 5, 0.9));
    border: 2.5px solid #ff003c; 
    color: #ffffff;
    padding: 16px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
    cursor: pointer;
    text-shadow: 0 0 12px #ff003c;
    box-shadow: 0 0 30px rgba(255, 0, 60, 0.65), inset 0 0 20px rgba(255, 0, 60, 0.4); 
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.2), background 0.2s, box-shadow 0.2s;
    clip-path: polygon(15px 0%, 100% 0%, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0% 100%, 0% 15px);
}

.warning-btn:hover {
    transform: translateY(-2px);
    background: #ff003c;
    box-shadow: 0 0 45px #ff003c, 0 0 15px #ffffff;
    text-shadow: 0 0 12px #fff;
}

/* MODALS */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 4, 12, 0.96);
    z-index: 100;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-box {
    width: 100%;
    max-width: 380px;
    background: rgba(0, 8, 22, 0.95);
    border: 1px solid rgba(0, 195, 255, 0.4);
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 0 25px rgba(0,195,255,0.2);
}

.modal-close {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1.5px solid #00c3ff;
    color: #00c3ff;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    text-transform: uppercase;
    box-shadow: 0 0 8px rgba(0,195,255,0.3);
}

.leaderboard-title {
    color: #00c3ff;
    font-size: 18px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 15px;
    text-shadow: 0 0 10px rgba(0,195,255,0.5);
}

.leaderboard-table {
    width: 100%;
    border-collapse: collapse;
    color: #fff;
    font-size: 13px;
}

.leaderboard-table th {
    color: rgba(0, 195, 255, 0.6);
    text-transform: uppercase;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(0, 195, 255, 0.3);
    text-align: left;
}

.leaderboard-table td { padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }

/* JUMPSCARE SLASH GRAPHICS */
.slash-effect {
    position: absolute;
    width: 260px;
    height: 3px;
    background: #ffffff;
    box-shadow: 0 0 8px #00d2ff, 0 0 20px #0055ff;
    z-index: 10005;
    pointer-events: none;
    transform-origin: center;
    transform: translate3d(-50%, -50%, 0) scaleX(0.05) rotate(var(--rot));
    animation: slashFade 0.16s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

@keyframes slashFade {
    100% { transform: translate3d(-50%, -50%, 0) scaleX(1.3) rotate(var(--rot)); opacity: 0; }
}

.jumpscare-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 1000;
    display: none;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 40px 20px;
}

.jumpscare-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}

.boss-ui-container {
    width: 100%;
    max-width: 460px;
    background: rgba(0, 0, 0, 0.9);
    padding: 16px 20px;
    border-radius: 8px;
    border: 2px solid #ff003c;
    box-shadow: 0 0 20px #ff003c;
}

.boss-name {
    color: #fff;
    font-size: 15px;
    font-weight: 900;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 10px;
    text-shadow: 0 0 8px #ff003c;
}

.hp-bar-outer {
    width: 100%;
    height: 14px;
    background: rgba(30, 0, 8, 0.8);
    border: 1px solid rgba(255, 0, 60, 0.4);
    margin-bottom: 8px;
}

.hp-bar-inner {
    width: 100%;
    height: 100%;
    background: #ff003c;
    box-shadow: 0 0 12px #ff003c;
    transition: width 0.04s ease-out;
}

.rage-bar-outer { width: 100%; height: 6px; background: rgba(0, 20, 35, 0.8); }
.rage-bar-inner { width: 0%; height: 100%; background: #00c3ff; box-shadow: 0 0 8px #00c3ff; transition: width 0.1s ease; }

.jumpscare-overlay.overdrive-active .jumpscare-img { animation: rageShake 0.1s infinite; filter: hue-rotate(180deg) brightness(1.3); }
@keyframes rageShake { 0% { transform: translate(2px, 1px); } 50% { transform: translate(-1px, -2px); } 100% { transform: translate(1px, 2px); } }

.input-box input {
    width: 100%; padding: 12px; background: #000; border: 1.5px solid #00c3ff; color: #fff; border-radius: 8px; margin-bottom: 15px; text-align: center; box-shadow: 0 0 10px rgba(0,195,255,0.2);
}
.input-box button { width: 100%; padding: 12px; background: #00c3ff; color: #000; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 0 15px #00c3ff; border: none; }
</style>
</head>
<body onclick="unlockAudioEngine()">

<!-- HIGH-PERFORMANCE NATIVE VIDEO LOOP WITH NEW DIRECT LINK -->
<video id="bg-video" class="video-background" autoplay loop muted playsinline>
    <source src="https://files.catbox.moe/dbel8g.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="top-nav">
    <button id="music-btn" class="nav-btn" onclick="toggleAudioEngine(event)">🔊 AUDIO: ON</button>
    <button class="nav-btn" onclick="openLeaderboard()">🏆 LEADERBOARD</button>
</div>

<div class="card-container">
    <div class="card">
        <div class="avatar-container">
            <div class="ring-layer-1"></div>
            <div class="ring-layer-2"></div>
            <div class="ring-layer-3"></div>
            <img src="https://i.postimg.cc/pXBrdS2z/v8Yw-Jb.jpg" class="avatar" alt="Anosカミ">
        </div>
        
        <div class="name">Anosカミ</div>
        <div class="bio">
        The faintest ray of hope.<br>
        Only those who reach out toward even the faintest ray of hope will be granted a MIRACLE.<br><br>
        (discord user: anos_edits)
        </div>
        <div class="role">Editor</div>
        <div class="links">
            <a href="https://www.instagram.com/anoskami?igsh=MWVwYWhzbzluZTE3aQ==" target="_blank">Instagram</a>
            <a href="https://www.youtube.com/@anosamvedit" target="_blank">YouTube Channel</a>
        </div>
        <!-- VISITOR COUNTER -->
        <div class="visit-counter">
            👁️ VISITS: <span id="visit-count">...</span>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <button class="warning-btn" onclick="triggerEmergency()">DO NOT PRESS</button>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="board-modal">
    <div class="modal-box">
        <div class="leaderboard-title">Hunter Records</div>
        <table class="leaderboard-table"><tbody id="leaderboard-entries"></tbody></table>
        <button class="modal-close" onclick="closeLeaderboard()">Close</button>
    </div>
</div>

<div class="modal-overlay" id="name-modal">
    <div class="modal-box input-box">
        <div class="leaderboard-title" style="color:#ff003c;">RECORD FOUND</div>
        <input type="text" id="username-input" placeholder="ENTER TAG NAME" maxlength="14">
        <button onclick="submitProfileName()">Confirm Save</button>
    </div>
</div>

<div class="jumpscare-overlay" id="jumpscare" onmousedown="registerHit(event)" ontouchstart="registerHit(event)">
    <div class="boss-ui-container">
        <div class="boss-name" id="boss-title-ui">💥 BOSS: DEITY OF THE TEMPLES 💥</div>
        <div class="hp-bar-outer"><div class="hp-bar-inner" id="boss-hp"></div></div>
        <div class="rage-bar-outer"><div class="rage-bar-inner" id="rage-meter"></div></div>
    </div>
    <img src="https://i.postimg.cc/yYbnstQd/images-(10).jpg" class="jumpscare-img" id="boss-image-element">
</div>

<div class="modal-overlay" id="victory-layer">
    <div class="modal-box" style="text-align:center;">
        <div class="leaderboard-title" style="color:#00c3ff;">[QUEST CLEARED]</div>
        <p style="color:#fff; font-size:13px; margin-bottom:20px;" id="victory-time-msg"></p>
        <button class="warning-btn" style="border-color:#00c3ff; color:#00c3ff;" onclick="closeVictoryScreen()">Return</button>
    </div>
</div>

<script>
let audioCtx = null;
let bossHp = 100;
let rageCombo = 0;
let overdriveMode = false;
let isGameOver = false;
let gameStartTime = 0;
let lastClearTime = 0;
let audioUnlocked = true;

// UPDATED REDIRECT TARGET LINK
const targetRedirectUrl = "https://youtu.be/1WDCEtDUoAI?si=7AvhhVKzw3nyaUut";
const videoElement = document.getElementById("bg-video");

// VISIT COUNTER LOGIC
async function fetchVisitCount() {
    try {
        const response = await fetch("https://api.countapi.xyz/hit/anoskami_profile/visits");
        const data = await response.json();
        document.getElementById("visit-count").innerText = data.value;
    } catch (err) {
        // Fallback to local visitor counter if API fails
        let visits = parseInt(localStorage.getItem('page_visits') || '0') + 1;
        localStorage.setItem('page_visits', visits);
        document.getElementById("visit-count").innerText = visits;
    }
}
fetchVisitCount();

function unlockAudioEngine() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    if (videoElement && audioUnlocked) {
        videoElement.muted = false;
        videoElement.play().catch(()=>{});
    }
}

function toggleAudioEngine(e) {
    if(e) e.stopPropagation();
    unlockAudioEngine();
    
    const btn = document.getElementById("music-btn");
    
    if (audioUnlocked) {
        if(videoElement) videoElement.muted = true;
        audioUnlocked = false;
        btn.innerHTML = "🔈 AUDIO: OFF";
        btn.style.borderColor = "rgba(0,195,255,0.3)";
    } else {
        if(videoElement) {
            videoElement.muted = false;
            videoElement.play().catch(()=>{});
        }
        audioUnlocked = true;
        btn.innerHTML = "🔊 AUDIO: ON";
        btn.style.borderColor = "#00c3ff";
        playSciFiSlashSound();
    }
}

function playSciFiSlashSound() {
    unlockAudioEngine();
    if (!audioCtx || !audioUnlocked) return;
    try {
        let now = audioCtx.currentTime;
        let factor = overdriveMode ? 1.4 : 1.0;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1300 * factor, now);
        osc.frequency.exponentialRampToValueAtTime(100 * factor, now + 0.12);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.13);
    } catch(err){}
}

function openLeaderboard() {
    const entriesList = document.getElementById('leaderboard-entries');
    entriesList.innerHTML = '<tr><th>Rank</th><th>Hunter</th><th>Time</th></tr>';
    
    let rawData = JSON.parse(localStorage.getItem('hunter_board')) || [{name: "Sung_Jinwoo", time: 3.82}];
    
    let uniquePlayers = {};
    rawData.forEach(entry => {
        let nameKey = entry.name.trim().toLowerCase();
        if (!uniquePlayers[nameKey] || entry.time < uniquePlayers[nameKey].time) {
            uniquePlayers[nameKey] = entry; 
        }
    });

    let filteredData = Object.values(uniquePlayers);
    filteredData.sort((a, b) => a.time - b.time);

    filteredData.forEach((p, i) => {
        entriesList.innerHTML += `<tr><td>#${i + 1}</td><td>${p.name}</td><td style="color:#00c3ff;">${p.time.toFixed(2)}s</td></tr>`;
    });
    document.getElementById('board-modal').style.display = 'flex';
}

function closeLeaderboard() { document.getElementById('board-modal').style.display = 'none'; }

function triggerEmergency() {
    unlockAudioEngine();
    bossHp = 100; rageCombo = 0; overdriveMode = false; isGameOver = false;
    document.getElementById('boss-title-ui').innerText = "💥 BOSS: DEITY OF THE TEMPLES 💥";
    document.getElementById('jumpscare').classList.remove('overdrive-active');
    document.getElementById('boss-hp').style.width = '100%';
    document.getElementById('rage-meter').style.width = '0%';
    document.getElementById('jumpscare').style.display = 'flex';
    gameStartTime = Date.now();
}

function registerHit(e) {
    if (isGameOver) return;
    if (e) e.preventDefault();

    let hitDamage = overdriveMode ? 7.0 : 3.5;
    bossHp -= hitDamage;
    
    if (!overdriveMode) {
        rageCombo += 7;
        document.getElementById('rage-meter').style.width = Math.min(rageCombo, 100) + '%';
        if (rageCombo >= 100) {
            overdriveMode = true;
            document.getElementById('boss-title-ui').innerText = "⚡ OVERDRIVE ACTIVE ⚡";
            document.getElementById('jumpscare').classList.add('overdrive-active');
        }
    }

    document.getElementById('boss-hp').style.width = Math.max(bossHp, 0) + '%';
    
    let x = e.clientX || (e.touches && e.touches[0].clientX);
    let y = e.clientY || (e.touches && e.touches[0].clientY);
    if(x && y) spawnSlash(x, y);
    playSciFiSlashSound();

    if (bossHp <= 0) {
        isGameOver = true;
        lastClearTime = (Date.now() - gameStartTime) / 1000;
        document.getElementById('jumpscare').style.display = 'none';
        
        let savedName = localStorage.getItem('saved_hunter_name');
        if (savedName) {
            handleScoreAndRouting(lastClearTime);
        } else {
            document.getElementById('name-modal').style.display = 'flex';
        }
    }
}

function spawnSlash(x, y) {
    const s = document.createElement('div');
    s.className = 'slash-effect';
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.setProperty('--rot', Math.random() * 360 + 'deg');
    document.getElementById('jumpscare').appendChild(s);
    setTimeout(() => s.remove(), 160);
}

function submitProfileName() {
    let name = document.getElementById('username-input').value.trim();
    if(name) {
        localStorage.setItem('saved_hunter_name', name);
        document.getElementById('name-modal').style.display = 'none';
        handleScoreAndRouting(lastClearTime);
    }
}

function handleScoreAndRouting(time) {
    let data = JSON.parse(localStorage.getItem('hunter_board')) || [{name: "Sung_Jinwoo", time: 3.82}];
    let currentName = localStorage.getItem('saved_hunter_name') || "Anonymous";
    data.push({name: currentName, time: time});
    localStorage.setItem('hunter_board', JSON.stringify(data));

    let isFirstTime = !localStorage.getItem('boss_redirect_done');
    
    if (isFirstTime) {
        localStorage.setItem('boss_redirect_done', 'true');
        window.location.href = targetRedirectUrl;
    } else {
        document.getElementById('victory-time-msg').innerHTML = `Protocol Clear: <strong>${time.toFixed(2)}s</strong><br><span style="color:#00c3ff; font-size:11px;">RECORD UPDATED</span>`;
        document.getElementById('victory-layer').style.display = 'flex';
    }
}

function closeVictoryScreen() { document.getElementById('victory-layer').style.display = 'none'; }
