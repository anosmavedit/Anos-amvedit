<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Room Chat with Profile & Images</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050508;
      font-family: Arial, sans-serif;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    /* Overlay UI for Chat */
    #chat-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 320px;
      max-height: 250px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(0, 195, 255, 0.3);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-shadow: 0 0 15px rgba(0, 195, 255, 0.2);
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      font-size: 13px;
      color: #fff;
    }

    .message {
      margin-bottom: 8px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message .username {
      color: #00c3ff;
      font-weight: bold;
    }

    .message img {
      max-width: 100%;
      border-radius: 4px;
      margin-top: 5px;
      display: block;
    }

    #chat-input-container {
      display: flex;
      gap: 5px;
    }

    #chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px;
      color: #fff;
      outline: none;
    }

    #send-btn {
      background: #00c3ff;
      border: none;
      color: #000;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Modal for Profile Settings */
    #profile-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #111;
      border: 2px solid #00c3ff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 195, 255, 0.5);
      z-index: 100;
      color: white;
      text-align: center;
    }

    #profile-modal input {
      padding: 8px;
      margin: 10px 0;
      width: 80%;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
    }

    #profile-modal button {
      background: #00c3ff;
      border: none;
      padding: 8px 16px;
      color: #000;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Chat UI -->
  <div id="chat-container">
    <div id="chat-messages"></div>
    <div id="chat-input-container">
      <input type="text" id="chat-input" placeholder="Type a message or ![](url)...">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal">
    <h3>Set Username</h3>
    <input type="text" id="username-input" placeholder="Enter username...">
    <br>
    <button id="save-username-btn">Save Profile</button>
  </div>

  <script>
    // --- Local Storage Username Management ---
    let username = localStorage.getItem("chat_username") || "Guest_" + Math.floor(Math.random() * 1000);

    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // --- Lighting Setup ---
    // Ambient light keeps overall room visible
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    // WHITE Light source directed at the blue accents/room interior
    const whiteLight = new THREE.PointLight(0xffffff, 1.2, 20);
    whiteLight.position.set(0, 2, 2);
    scene.add(whiteLight);

    // --- Room Geometry ---
    // Black Wall Material (MeshStandardMaterial so it retains pure black dark shading)
    const darkWallMaterial = new THREE.MeshStandardMaterial({
      color: 0x111115,
      roughness: 0.8,
      metalness: 0.2
    });

    // White Emissive Blue Accent Material (Glowing structure edges/trim stay white/blue glow)
    const glowMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff
    });

    // Back Wall
    const wallGeometry = new THREE.PlaneGeometry(10, 8);
    const backWall = new THREE.Mesh(wallGeometry, darkWallMaterial);
    backWall.position.z = -5;
    scene.add(backWall);

    // Top Wall (Ceiling)
    const topWall = new THREE.Mesh(wallGeometry, darkWallMaterial);
    topWall.rotation.x = Math.PI / 2;
    topWall.position.y = 4;
    topWall.position.z = -2.5;
    scene.add(topWall);

    // --- 3D Profile Button inside Wall Top ---
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#00c3ff';
    ctx.fillRect(0, 0, 256, 64);
    ctx.fillStyle = '#000000';
    ctx.font = 'Bold 28px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PROFILE', 128, 32);

    const buttonTexture = new THREE.CanvasTexture(canvas);
    const buttonMaterial = new THREE.MeshBasicMaterial({ map: buttonTexture });
    const buttonGeometry = new THREE.PlaneGeometry(2, 0.5);
    const profileButtonMesh = new THREE.Mesh(buttonGeometry, buttonMaterial);
    
    // Position on top inside wall
    profileButtonMesh.position.set(0, 3.8, -4.9);
    scene.add(profileButtonMesh);

    // --- Raycasting for 3D Button Click ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(profileButtonMesh);

      if (intersects.length > 0) {
        document.getElementById('profile-modal').style.display = 'block';
        document.getElementById('username-input').value = username;
      }
    });

    // --- Profile Modal Logic ---
    document.getElementById('save-username-btn').addEventListener('click', () => {
      const inputVal = document.getElementById('username-input').value.trim();
      if (inputVal) {
        username = inputVal;
        localStorage.setItem("chat_username", username);
      }
      document.getElementById('profile-modal').style.display = 'none';
    });

    // --- Chat System with PostImages Markdown Parser ---
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const chatMessages = document.getElementById('chat-messages');

    function parseMarkdownImage(text) {
      // Regex matching Markdown image syntax: ![alt](url)
      const mdImageRegex = /!\[.*?\]\((https?:\/\/[^\s]+)\)/g;
      return text.replace(mdImageRegex, (match, url) => {
        return `<br><img src="${url}" alt="User Image" />`;
      });
    }

    function appendMessage(user, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      const formattedText = parseMarkdownImage(text);
      msgDiv.innerHTML = `<span class="username">${user}:</span> ${formattedText}`;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendMessage() {
      const text = chatInput.value.trim();
      if (text !== '') {
        appendMessage(username, text);
        chatInput.value = '';
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // --- Window Resize & Render Loop ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
